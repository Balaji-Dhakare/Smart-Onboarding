<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students | HMarkIT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="./css/student.css" />
    <link rel="stylesheet" href="./css/student-table.css" />
  </head>
  <body>
    <div class="student-layout">
      <aside class="student-sidebar">
        <a class="student-sidebar-brand" href="./index.html"><img src="./assets/images/hmarkit-mark.svg" alt="HMarkIT" /> HMarkIT</a>
        <p>Menu</p>
        <a href="./index.html"><i class="bi bi-grid-fill"></i> Dashboard</a>
        <p>Components</p>
        <a class="active" href="./student.html"><i class="bi bi-mortarboard-fill"></i> Student</a>
        <a href="./emp.html"><i class="bi bi-person-fill"></i> Employee</a>
      </aside>
      <div class="student-page">
      <header class="student-topbar">
        <a class="student-brand" href="./index.html"><img src="./assets/images/hmarkit-mark.svg" alt="HMarkIT" /> HMarkIT</a>
        <a class="back-link" href="./index.html">← Dashboard</a>
      </header>

      <main class="container-fluid student-main">
        <div class="page-title-row">
          <div>
            <p class="eyebrow">School workforce</p>
            <h1>Student Directory</h1>
            <p class="subtitle">Manage and filter registered students.</p>
          </div>
          <a class="new-student-button" href="./stdform.html">＋ New Student</a>
        </div>

        <section class="row g-3 mb-4" aria-label="Student summary">
          <div class="col-12 col-md-4"><div class="student-stat"><span>Total Students</span><strong id="totalStudents">0</strong><small>Students in the system</small></div></div>
        </section>

        <section class="filter-panel" aria-label="Filter students">
          <div class="filter-heading"><div><h2>Filters</h2></div><span id="resultCount">0 results</span></div>
          <div class="row g-3">
            <div class="col-12 col-lg-4"><label for="studentSearch">Search</label><input id="studentSearch" type="search" placeholder="Search by student id, name or email" /></div>
            <div class="col-6 col-lg-2"><label for="classFilter">Class</label><select id="classFilter"><option value="">All classes</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></div>
            <div class="col-6 col-lg-2"><label for="batchFilter">Batch</label><select id="batchFilter"><option value="">All batches</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select></div>
            <div class="col-6 col-lg-2"><label for="genderFilter">Gender</label><select id="genderFilter"><option value="">All genders</option><option>Male</option><option>Female</option><option>Other</option></select></div>
            <div class="col-6 col-lg-2 d-flex align-items-end filter-actions"><button class="clear-button" id="clearFilters" type="button">Clear filters</button><button class="apply-button" id="applyFilters" type="button"><i class="bi bi-search" aria-hidden="true"></i> Apply Filters</button></div>
          </div>
        </section>

        <section id="studentGrid" class="student-table-panel" aria-live="polite"><div class="loading-state">Loading students...</div></section>
      </main>
      </div>
    </div>
    <script src="./js/api/studentApi.js"></script>
    <script src="./js/student.js"></script>
  </body>
</html>
